<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#112a7a">
<title>FS Soluções</title>
<style>html,body{margin:0;width:100%;height:100%;background:#f3f6fb}body{visibility:hidden}</style>
<script>
(function(){
  'use strict';
  function mobileOrTablet(){
    var ua=navigator.userAgent||'';
    if(/Android|iPhone|iPod|iPad|Mobile|Tablet|Silk|Kindle|PlayBook/i.test(ua)) return true;
    if(navigator.platform==='MacIntel' && navigator.maxTouchPoints>1) return true;
    try{ if(navigator.userAgentData && navigator.userAgentData.mobile) return true; }catch(e){}
    return false;
  }
  var preferred = '';
  try { preferred = localStorage.getItem('fs_central_preferred_index') || localStorage.getItem('fs_plataforma_escolhida') || ''; } catch(e){}
  if(preferred === 'desktop' || preferred === 'index-desktop.html'){ location.replace('./index-desktop.html'); return; }
  if(preferred === 'mobile' || preferred === 'index-mobile.html'){ location.replace('./index-mobile.html'); return; }
  var desktop = !mobileOrTablet() && Math.max(innerWidth||0,screen.width||0)>=900;
  location.replace(desktop ? './index-desktop.html' : './index-mobile.html');
})();
</script>
<noscript><meta http-equiv="refresh" content="0;url=./index-mobile.html"></noscript>
</head><body></body></html>
